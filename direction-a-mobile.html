    // its OWN frames — from local text at the root, or text obtained from

    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends

    // opaque contexts — file:// — everything serializes as 'null', where

      // and sender identity (own child frame / direct parent) is checked

    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.

    const resourceBlobs = {};

    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down

      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }

      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }

      return out;

      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;

        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach

        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    setStatus('Unpacking ' + uuids.length + ' assets...');

            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');

        }

        console.error('Failed to decode asset ' + uuid + ':', err);

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

8, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"fe3a5187-3f32-4c2e-a8f5-ef781b25520f\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  body { margin: 0; background: #ADB4BC; }\n  * { box-sizing: border-box; }\n  a { color: #385447; }\n  a:hover { color: #2B4137; }\n  div { scrollbar-width: none; -ms-overflow-style: none; }\n  div::-webkit-scrollbar { display: none; width: 0; height: 0; }\n  @keyframes aSheet { from { transform: translateY(100%) } to { transform: translateY(0) } }\n  @media (prefers-reduced-motion: reduce) { * { animation: none !important } }\n<\u002Fstyle>\n<style>\n  :root { --backdrop:#C7C2BA; }\n\n  html, body {\n    margin:0; padding:0; height:100vh;\n    background:var(--backdrop); overflow:hidden;\n  }\n  @supports (height:100dvh) { html, body { height:100dvh; } }\n\n  /* <x-dc> is the template runtime's root custom element, display:inline by\n     default. A percentage height below it cannot resolve, which is why the\n     frame was falling back to content height (~1500px) instead of the\n     viewport. Blockify it and give it the viewport. */\n  x-dc { display:block; height:100%; }\n\n  [data-proto=\"stage\"] {\n    display:flex; justify-content:center; align-items:stretch;\n    height:100%; background:var(--backdrop);\n  }\n\n  /* Height in viewport units rather than a percentage, so the frame no longer\n     depends on any ancestor resolving its own height. */\n  [data-proto=\"frame\"] { width:100%; flex:none; height:100vh; }\n  @supports (height:100dvh) { [data-proto=\"frame\"] { height:100dvh; } }\n\n  /* THE SCROLL FIX.\n     Inside the frame the tree is:  views wrapper (flex) > <sc-if> > view (flex:1, overflow:auto)\n     <sc-if> is a template custom element, so it is display:inline by default.\n     That severs the flex chain: the view's flex:1 has no flex parent to\n     resolve against, so it falls back to content height, nothing can scroll,\n     and the nav gets pushed out of the frame.\n     Rather than fight sc-if's display (the runtime may rely on it to hide\n     inactive views), the wrapper itself becomes the scroll container. Its\n     height is bounded by the frame, so it scrolls; the nav stays a flex:none\n     sibling of it and is therefore pinned. */\n  [data-proto=\"views\"] {\n    display:block !important;\n    flex:1 1 auto; min-height:0;\n    overflow-y:auto; overflow-x:hidden;\n    -webkit-overflow-scrolling:touch;\n    overscroll-behavior:contain;\n  }\n\n  [data-proto=\"nav\"] {\n    flex:0 0 auto;\n    padding-bottom:env(safe-area-inset-bottom, 0px);\n  }\n\n  /* Phones and foldables in portrait: edge to edge. */\n  @media (max-width:600px) {\n    [data-proto=\"frame\"] { width:100%; }\n  }\n\n  /* Desktop: the app sits as a device on a contrasting backdrop. */\n  @media (min-width:601px) {\n    [data-proto=\"stage\"] { align-items:center; }\n    [data-proto=\"frame\"] {\n      width:390px;\n      height:min(844px, calc(100dvh - 48px));\n      box-shadow:0 18px 50px rgba(0,0,0,0.30);\n    }\n  }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div data-proto=\"stage\" style=\"font-family:Inter, system-ui, sans-serif;\">\n\n  <!-- ================= MOBILE 390x844 ================= -->\n  <div data-proto=\"frame\" style=\"background:#FAF9F7; overflow:hidden; display:flex; flex-direction:column; position:relative;\">\n\n    <header style=\"height:56px; flex:none; background:#FFFFFF; border-bottom:1px solid #E7E4DF; display:flex; align-items:center; gap:4px; padding:0 8px; position:relative;\">\n      <sc-if value=\"{{ showBack }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"width:48px; :16px; border-top:1px solid #E7E4DF;\">Ce qui a été constaté<\u002Fdiv>\n          <div style=\"font-size:16px; line-height:24px; color:#1A1917; margin-top:2px;\">Tension 148/92 au repos. Rythme cardiaque régulier. Auscultation normale. Pas de signe de surcharge.<\u002Fdiv>\n          <div style=\"font-size:14px; line-height:20px; font-weight:500; color:#5C5850; margin-top:16px; padding-top:16px; border-top:1px solid #E7E4DF;\">Ce qui a été décidé<\u002Fdiv>\n          <div style=\"font-size:16px; line-height:24px; color:#1A1917; margin-top:2px;\">Poursuite du Lisinopril 10 mg, un comprimé le matin. Contrôle de la tension à domicile deux fois par semaine. Nouvelle visite dans trois semaines.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <h2 style=\"margin:24px 0 8px 0; font-size:17px; line-height:24px; font-weight:600; color:#1A1917;\">Documents produits après cette visite<\u002Fh2>\n        <div style=\"display:flex; flex-direction:column; gap:8px;\">\n          <div style=\"min-height:48px; background:#FFFFFF; border-radius:12px; box-shadow:0 1px 2px rgba(26,25,23,0.06); padding:12px 16px; display:flex; align-items:center; gap:12px; cursor:pointer;\" style-hover=\"background:#F4F2EF;\" sc-camel-on-click=\"{{ goDocDetail }}\">\n            <svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#476A59\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;\"><path d=\"M14 3H6v18h12V7z\"><\u002Fpath><path d=\"M14 3v4h4M9 13h6\"><\u002Fpath><\u002Fsvg>\n            <div style=\"min-width:0;\">\n              <div style=\"font-size:16px; line-height:24px; color:#1A1917;\">Ordonnance — Lisinopril 10 mg<\u002Fdiv>\n              <div style=\"font-size:14px; line-height:20px; color:#5C5850;\">2 septembre — renouvelable<\u002Fdiv>\n            <\u002Fdiv>\n            <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#5C5850\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none; margin-left:auto;\"><path d=\"M9 6l6 6-6 6\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n          <div style=\"min-height:48px; background:#FFFFFF; border-radius:12px; box-shadow:0 1px 2px rgba(26,25,23,0.06); padding:12px 16px; display:flex; align-items:center; gap:12px; cursor:pointer;\" style-hover=\"background:#F4F2EF;\" sc-camel-on-click=\"{{ goSignature }}\">\n            <svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#B26A00\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;\"><path d=\"M4 20h16M6 15.5 16.5 5a2.1 2.1 0 013 3L9 18.5l-4 1z\"><\u002Fpath><\u002Fsvg>\n            <div style=\"min-width:0;\">\n              <div style=\"font-size:16px; line-height:24px; color:#1A1917;\">Facture de la consultation du 21 août<\u002Fdiv>\n              <div style=\"font-size:14px; line-height:20px; color:#B26A00;\">À signer avant le 20 septembre<\u002Fdiv>\n            <\u002Fdiv>\n            <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#5C5850\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none; margin-left:auto;\"><path d=\"M9 6l6 6-6 6\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <button style=\"width:100%; min-height:48px; margin-top:20px; border-radius:8px; background:transparent; border:1.5px solid #476A59; color:#385447; font-family:inherit; font-size:16px; font-weight:500; cursor:pointer;\" style-hover=\"background:#F2F6F3;\" sc-camel-on-click=\"{{ goMsg }}\">Poser une question à Sandra<\u002Fbutton>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n      <!-- ===== ÉTAPE 1 — POUR QUI ===== -->\n      <sc-if value=\"{{ vReq1 }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"flex:1; min-width:0; display:flex; flex-direction:column;\">\n        <div style=\"flex:1; min-height:0; overflow:auto; padding:16px 16px 24px 16px;\">\n          <div style=\"font-size:14px; line-height:20px; font-weight:500; color:#5C5850;\">Étape 1 sur 4<\u002Fdiv>\n          <div style=\"height:4px; border-radius:9999px; background:#E7E4DF; margin-top:8px; overflow:hidden;\">\n            <div style=\"width:25%; height:100%; background:#476A59;\"><\u002Fdiv>\n          <\u002Fdiv>\n          <h1 style=\"margin:20px 0 4px 0; font-size:24px; line-height:30px; font-weight:600; color:#1A1917;\">Pour qui est cette visite ?<\u002Fh1>\n          <p style=\"margin:0 0 20px 0; font-size:16px; line-height:24px; color:#5C5850;\">Choisissez la personne que le médecin viendra voir. Vous pouvez demander une visite pour un proche dont vous vous occupez.<\u002Fp>\n\n          <div style=\"display:flex; flex-direction:column; gap:8px;\">\n            <div style=\"{{ quiMoiStyle }}\" sc-camel-on-click=\"{{ setQuiMoi }}\">\n              <div style=\"{{ quiMoiRadio }}\"><\u002Fdiv>\n              <div style=\"min-width:0;\">\n                <div style=\"font-size:17px; line-height:24px; font-weight:600; color:#1A1917;\">Camille Berger<\u002Fdiv>\n                <div style=\"font-size:16px; line-height:24px; color:#5C5850;\">Moi-même — 34 ans<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"{{ quiFilsStyle }}\" sc-camel-on-click=\"{{ setQuiFils }}\">\n              <div style=\"{{ quiFilsRadio }}\"><\u002Fdiv>\n              <div style=\"min-width:0;\">\n                <div style=\"font-size:17px; line-height:24px; font-weight:600; color:#1A1917;\">Louis Berger<\u002Fdiv>\n                <div style=\"font-size:16px; line-height:24px; color:#5C5850;\">Mon fils — 6 ans<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"{{ quiMereStyle }}\" sc-camel-on-click=\"{{ setQuiMere }}\">\n              <div style=\"{{ quiMereRadio }}\"><\u002Fdiv>\n              <div style=\"min-width:0;\">\n                <div style=\"font-size:17px; line-height:24px; font-weight:600; color:#1A1917;\">Renée Berger<\u002Fdiv>\n                <div style=\"font-size:16px; line-height:24px; color:#5C5850;\">Ma mère — 81 ans<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:16px; background:#EEF4FB; border-radius:12px; padding:12px 16px; display:flex; gap:12px; align-items:flex-start;\">\n            <svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#184472\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;\"><circle cx=\"12\" cy=\"12\" r=\"8.5\"><\u002Fcircle><path d=\"M12 11v5.5M12 8h.01\"><\u002Fpath><\u002Fsvg>\n            <div style=\"font-size:16px; line-height:24px; color:#184472;\">Une autre personne à ajouter ? Vous pouvez l’enregistrer dans « Mon compte », rubrique « Mes proches ».<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:none; background:#FFFFFF; border-top:1px solid #E7E4DF; padding:12px 16px;\">\n          <button style=\"width:100%; min-height:48px; border:none; border-radius:8px; background:#476A59; color:#FFFFFF; font-family:inherit; font-size:16px; font-weight:500; cursor:pointer;\" style-hover=\"background:#385447;\" sc-camel-on-click=\"{{ goReq2 }}\">Continuer vers le motif<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ===== ÉTAPE 2 — MOTIF ===== -->\n      <sc-if value=\"{{ vReq2 }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"flex:1; min-width:0; display:flex; flex-direction:column;\">\n        <div style=\"flex:1; min-height:0; overflow:auto; padding:16px 16px 24px 16px;\">\n          <div style=\"font-size:14px; line-height:20px; font-weight:500; color:#5C5850;\">Étape 2 sur 4<\u002Fdiv>\n          <div style=\"height:4px; border-radius:9999px; background:#E7E4DF; margin-top:8px; overflow:hidden;\">\n            <div style=\"width:50%; height:100%; background:#476A59;\"><\u002Fdiv>\n          <\u002Fdiv>\n          <h1 style=\"margin:20px 0 4px 0; font-size:24px; line-height:30px; font-weight:600; color:#1A1917;\">Que se passe-t-il ?<\u002Fh1>\n          <p style=\"margin:0 0 20px 0; font-size:16px; line-height:24px; color:#5C5850;\">Décrivez avec vos mots. Le médecin lit votre message avant de venir.<\u002Fp>\n\n          <label for=\"a-motif\" style=\"display:block; font-size:14px; line-height:20px; font-weight:500; color:#1A1917; margin-bottom:6px;\">Vos symptômes<\u002Flabel>\n          <textarea id=\"a-motif\" value=\"{{ motif }}\" sc-camel-on-change=\"{{ onMotif }}\" placeholder=\"Par exemple : de la fièvre depuis deux jours et une forte toux.\" style=\"{{ motifStyle }}\"><\u002Ftextarea>\n          <sc-if value=\"{{ motifErr }}\" hint-placeholder-val=\"{{ false }}\">\n            <div role=\"alert\" style=\"margin-top:6px; display:flex; align-items:flex-start; gap:6px;\">\n              <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#C0362C\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;\"><circle cx=\"12\" cy=\"12\" r=\"8.5\"><\u002Fcircle><path d=\"M12 8v4.5M12 16h.01\"><\u002Fpath><\u002Fsvg>\n              <span style=\"font-size:14px; line-height:20px; color:#C0362C;\">Écrivez au moins une phrase sur ce que vous ressentez, pour que le médecin sache quoi préparer.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ motifOk }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"margin-top:6px; font-size:14px; line-height:20px; color:#5C5850;\">Inutile d’employer des termes médicaux. Écrivez comme vous le diriez au téléphone.<\u002Fdiv>\n          <\u002Fsc-if>\n\n          <div style=\"font-size:14px; line-height:20px; font-weight:500; color:#1A1917; margin:20px 0 6px 0;\">J’ai besoin de… <span style=\"font-weight:400; color:#5C5850;\">(facultatif, plusieurs choix possibles)<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:8px;\">\n            <sc-for list=\"{{ besoins }}\" as=\"b\" hint-placeholder-count=\"4\">\n              <div style=\"{{ b.style }}\" sc-camel-on-click=\"{{ b.toggle }}\">\n                <div style=\"{{ b.boxStyle }}\">\n                  <sc-if value=\"{{ b.on }}\" hint-placeholder-val=\"{{ false }}\">\n                    <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 12.5 9.5 18 20 6\"><\u002Fpath><\u002Fsvg>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n                <div style=\"min-width:0;\">\n                  <div style=\"font-size:16px; line-height:24px; font-weight:500; color:#1A1917;\">{{ b.titre }}<\u002Fdiv>\n                  <div style=\"font-size:14px; line-height:20px; color:#5C5850;\">{{ b.detail }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:20px; background:#FFFFFF; border-radius:12px; border-left:4px solid #C0362C; box-shadow:0 1px 2px rgba(26,25,23,0.06); padding:12px 16px; display:flex; gap:12px; align-items:flex-start;\">\n            <svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#C0362C\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;\"><circle cx=\"12\" cy=\"12\" r=\"8.5\"><\u002Fcircle><path d=\"M12 8v4.5M12 16h.01\"><\u002Fpath><\u002Fsvg>\n            <div style=\"font-size:16px; line-height:24px; color:#5C5850;\">Si la situation est grave maintenant — douleur à la poitrine, difficulté à respirer — appelez le 144 sans attendre.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:none; background:#FFFFFF; border-top:1px solid #E7E4DF; padding:12px 16px;\">\n          <button style=\"width:100%; min-height:48px; border:none; border-radius:8px; background:#476A59; color:#FFFFFF; font-family:inherit; font-size:16px; font-weight:500; cursor:pointer;\" style-hover=\"background:#385447;\" sc-camel-on-click=\"{{ submitReq2 }}\">Continuer vers l’adresse<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ===== ÉTAPE 3 — ADRESSE ET CRÉNEAU ===== -->\n      <sc-if value=\"{{ vReq3 }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"flex:1; min-width:0; display:flex; flex-direction:column;\">\n        <div style=\"flex:1; min-height:0; overflow:auto; padding:16px 16px 24px 16px;\">\n          <div style=\"font-size:14px; line-height:20px; font-weight:500; color:#5C5850;\">Étape 3 sur 4<\u002Fdiv>\n          <div style=\"height:4px; border-radius:9999px; background:#E7E4DF; margin-top:8px; overflow:hidden;\">\n            <div style=\"width:75%; height:100%; background:#476A59;\"><\u002Fdiv>\n          <\u002Fdiv>\n          <h1 style=\"margin:20px 0 4px 0; font-size:24px; line-height:30px; font-weight:600; color:#1A1917;\">Où et quand ?<\u002Fh1>\n          <p style=\"margin:0 0 20px 0; font-size:16px; line-height:24px; color:#5C5850;\">Le médecin se déplace dans le canton de Genève et sur La Côte.<\u002Fp>\n\n          <label for=\"a-adr\" style=\"display:block; font-size:14px; line-height:20px; font-weight:500; color:#1A1917; margin-bottom:6px;\">Adresse de la visite<\u002Flabel>\n          <input id=\"a-adr\" value=\"{{ adresse }}\" sc-camel-on-change=\"{{ onAdresse }}\" sc-camel-on-focus=\"{{ openAdr }}\" style=\"width:100%; min-height:48px; border:1px solid #D3CFC8; border-radius:4px; background:#FFFFFF; padding:0 12px; font-family:inherit; font-size:16px; color:#1A1917;\" style-focus=\"outline:none; border:2px solid #476A59; box-shadow:0 0 0 2px #FAF9F7, 0 0 0 4px #C4D6CA;\">\n          <sc-if value=\"{{ adrOuvert }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:4px; background:#FFFFFF; border:1px solid #E7E4DF; border-radius:8px; box-shadow:0 2px 8px rgba(26,25,23,0.08); overflow:hidden;\">\n              <sc-for list=\"{{ suggestions }}\" as=\"s\" hint-placeholder-count=\"3\">\n                <div style=\"min-height:48px; padding:12px 16px; display:flex; align-items:center; gap:10px; cursor:pointer; border-bottom:1px solid #E7E4DF;\" style-hover=\"background:#F4F2EF;\" sc-camel-on-click=\"{{ s.pick }}\">\n                  <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#5C5850\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;\"><path d=\"M12 21.5s6.5-6 6.5-11a6.5 6.5 0 10-13 0c0 5 6.5 11 6.5 11z\"><\u002Fpath><circle cx=\"12\" cy=\"10.5\" r=\"2.3\"><\u002Fcircle><\u002Fsvg>\n                  <span style=\"font-size:16px; line-height:24px; color:#1A1917;\">{{ s.label }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"{{ zoneStyle }}\">\n            <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none; margin-top:2px;\"><path d=\"{{ zoneIcon }}\"><\u002Fpath><\u002Fsvg>\n            <span style=\"font-size:14px; line-height:20px;\">{{ zoneText }}<\u002Fspan>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:12px; height:150px; border-radius:12px; overflow:hidden; border:1px solid #E7E4DF; background:#F4F2EF; position:relative;\">\n            <div style=\"position:absolute; inset:0; background-image:url(&quot;69e92fac-9059-46a7-a891-ba2c8e404f7d&quot;); background-size:cover; background-position:center;\"><\u002Fdiv>\n            <div style=\"position:absolute; left:50%; top:50%; transform:translate(-50%,-100%); display:flex; flex-direction:column; align-items:center;\">\n              <div style=\"width:28px; height:28px; border-radius:9999px; background:#476A59; border:3px solid #FFFFFF; box-shadow:0 2px 8px rgba(26,25,23,0.08);\"><\u002Fdiv>\n              <div style=\"width:2px; height:10px; background:#476A59;\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"position:absolute; left:12px; bottom:12px; right:12px; background:#FFFFFF; border-radius:8px; padding:6px 12px; font-size:14px; line-height:20px; color:#1A1917; box-shadow:0 1px 2px rgba(26,25,23,0.06);\">Vérifiez que le point est au bon endroit. La carte ne sert qu’à confirmer.<\u002Fdiv>\n          <\u002Fdiv>\n\n          <h2 style=\"margin:24px 0 8px 0; font-size:17px; line-height:24px; font-weight:600; color:#1A1917;\">Comment entrer chez vous<\u002Fh2>\n          <label for=\"a-etage\" style=\"display:block; font-size:14px; line-height:20px; font-weight:500; color:#1A1917; margin-bottom:6px;\">Étage et accès<\u002Flabel>\n          <input id=\"a-etage\" value=\"{{ etage }}\" sc-camel-on-change=\"{{ onEtage }}\" style=\"width:100%; min-height:48px; border:1px solid #D3CFC8; border-radius:4px; background:#FFFFFF; padding:0 12px; font-family:inherit; font-size:16px; color:#1A1917;\" style-focus=\"outline:none; border:2px solid #476A59; box-shadow:0 0 0 2px #FAF9F7, 0 0 0 4px #C4D6CA;\">\n          <label for=\"a-code\" style=\"display:block; font-size:14px; line-height:20px; font-weight:500; color:#1A1917; margin:16px 0 6px 0;\">Code d’entrée ou interphone<\u002Flabel>\n          <input id=\"a-code\" value=\"{{ code }}\" sc-camel-on-change=\"{{ onCode }}\" placeholder=\"Par exemple : 4207B, interphone « Berger »\" style=\"width:100%; min-height:48px; border:1px solid #D3CFC8; border-radius:4px; background:#FFFFFF; padding:0 12px; font-family:inherit; font-size:16px; color:#1A1917;\" style-focus=\"outline:none; border:2px solid #476A59; box-shadow:0 0 0 2px #FAF9F7, 0 0 0 4px #C4D6CA;\">\n          <div style=\"font-size:14px; line-height:20px; color:#5C5850; margin-top:6px;\">Lais ne-height:24px; color:#5C5850;\">Facture de la consultation à domicile du 21 août 2026, CHF 165.00, cabinet du Dr Marc Rey.<\u002Fp>\n        <div style=\"margin-top:16px; background:#F4F2EF; border-radius:12px; padding:16px;\">\n          <div style=\"height:12px; width:60%; border-radius:4px; background:#E7E4DF;\"><\u002Fdiv>\n          <div style=\"height:12px; width:40%; border-radius:4px; background:#E7E4DF; margin-top:10px;\"><\u002Fdiv>\n          <div style=\"height:12px; width:80%; border-radius:4px; background:#E7E4DF; margin-top:10px;\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"min-height:48px; margin-top:16px; display:flex; gap:12px; align-items:flex-start; cursor:pointer;\" sc-camel-on-click=\"{{ toggleConsent }}\">\n          <div style=\"{{ consentBoxStyle }}\">\n            <sc-if value=\"{{ consent }}\" hint-placeholder-val=\"{{ false }}\">\n              <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 12.5 9.5 18 20 6\"><\u002Fpath><\u002Fsvg>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <span style=\"font-size:16px; line-height:24px; color:#1A1917;\">Je confirme avoir reçu cette consultation et j’autorise le cabinet à transmettre la facture à Helvassura.<\u002Fspan>\n        <\u002Fdiv>\n        <button style=\"{{ signBtnStyle }}\" sc-camel-on-click=\"{{ signer }}\">Signer et envoyer<\u002Fbutton>\n        <button style=\"width:100%; min-height:48px; margin-top:8px; border:none; border-radius:8px; background:transparent; color:#385447; font-family:inherit; font-size:16px; font-weight:500; cursor:pointer;\" style-hover=\"background:#F2F6F3;\" sc-camel-on-click=\"{{ closeSheet }}\">Plus tard<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ sheetSigned }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:absolute; inset:0; background:rgba(26,25,23,0.5); display:flex; align-items:flex-end;\" sc-camel-on-click=\"{{ closeSheet }}\">\n      <div style=\"width:100%; background:#FFFFFF; border-radius:24px 24px 0 0; padding:12px 16px 20px 16px; box-shadow:0 8px 24px rgba(26,25,23,0.10); animation:aSheet 400ms cubic-bezier(0.05,0.7,0.1,1) both;\" sc-camel-on-click=\"{{ stop }}\">\n        <div style=\"width:32px; height:4px; border-radius:9999px; background:#D3CFC8; margin:0 auto 16px auto;\"><\u002Fdiv>\n        <div style=\"width:56px; height:56px; border-radius:9999px; background:#E1EBE4; display:flex; align-items:center; justify-content:center;\">\n          <svg width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1E7D46\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 12.5 9.5 18 20 6\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <h2 style=\"margin:16px 0 0 0; font-size:20px; line-height:26px; font-weight:600; color:#1A1917;\">C’est signé<\u002Fh2>\n        <p style=\"margin:8px 0 0 0; font-size:16px; line-height:24px; color:#5C5850;\">Le cabinet a reçu votre signature. Il transmet la facture à Helvassura ; vous n’avez plus rien à faire. Une copie signée est dans « Mes documents ».<\u002Fp>\n        <button style=\"width:100%; min-height:48px; margin-top:20px; border:none; border-radius:8px; background:#476A59; color:#FFFFFF; font-family:inherit; font-size:16px; font-weight:500; cursor:pointer;\" style-hover=\"background:#385447;\" sc-camel-on-click=\"{{ closeSheet }}\">Terminé<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ sheetCancel }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:absolute; inset:0; background:rgba(26,25,23,0.5); display:flex; align-items:flex-end;\" sc-camel-on-click=\"{{ closeSheet }}\">\n      <div style=\"width:100%; background:#FFFFFF; border-radius:24px 24px 0 0; padding:12px 16px 20px 16px; box-shadow:0 8px 24px rgba(26,25,23,0.10); animation:aSheet 400ms cubic-bezier(0.05,0.7,0.1,1) both;\" sc-camel-on-click=\"{{ stop }}\">\n        <div style=\"width:32px; height:4px; border-radius:9999px; background:#D3CFC8; margin:0 auto 16px auto;\"><\u002Fdiv>\n        <h2 style=\"margin:0; font-size:20px; line-height:26px; font-weight:600; color:#1A1917;\">Annuler la visite du 15 septembre ?<\u002Fh2>\n        <p style=\"margin:8px 0 0 0; font-size:16px; line-height:24px; color:#5C5850;\">Le créneau sera rendu à un autre patient. Si vous voulez seulement changer d’horaire, choisissez « Déplacer » : vous gardez votre place dans la semaine.<\u002Fp>\n        <p style=\"margin:8px 0 0 0; font-size:16px; line-height:24px; color:#5C5850;\">Annuler moins de 24 heures avant la visite peut être facturé CHF 40.00.<\u002Fp>\n        <button style=\"width:100%; min-height:48px; margin-top:20px; border:none; border-radius:8px; background:#C0362C; color:#FFFFFF; font-family:inherit; font-size:16px; font-weight:500; cursor:pointer;\" style-hover=\"background:#9E2C24;\" sc-camel-on-click=\"{{ confirmCancel }}\">Oui, annuler la visite<\u002Fbutton>\n        <button style=\"width:100%; min-height:48px; margin-top:8px; border-radius:8px; background:transparent; border:1.5px solid #476A59; color:#385447; font-family:inherit; font-size:16px; font-weight:500; cursor:pointer;\" style-hover=\"background:#F2F6F3;\" sc-camel-on-click=\"{{ closeSheet }}\">Non, garder mon rendez-vous<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ sheetDelete }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:absolute; inset:0; background:rgba(26,25,23,0.5); display:flex; align-items:flex-end;\" sc-camel-on-click=\"{{ closeSheet }}\">\n      <div style=\"width:100%; background:#FFFFFF; border-radius:24px 24px 0 0; padding:12px 16px 20px 16px; box-shadow:0 8px 24px rgba(26,25,23,0.10); animation:aSheet 400ms cubic-bezier(0.05,0.7,0.1,1) both;\" sc-camel-on-click=\"{{ stop }}\">\n        <div style=\"width:32px; height:4px; border-radius:9999px; background:#D3CFC8; margin:0 auto 16px auto;\"><\u002Fdiv>\n        <h2 style=\"margin:0; font-size:20px; line-height:26px; font-weight:600; color:#1A1917;\">Demander la suppression de vos données ?<\u002Fh2>\n        <p style=\"margin:8px 0 0 0; font-size:16px; line-height:24px; color:#5C5850;\">Vos messages, adresses et préférences seront supprimés de l’application. Le Dr Rey doit en revanche conserver votre dossier médical dix ans, comme la loi suisse l’exige.<\u002Fp>\n        <p style=\"margin:8px 0 0 0; font-size:16px; line-height:24px; color:#5C5850;\">Sandra vous appelle pour confirmer avant toute suppression.<\u002Fp>\n        <button style=\"width:100%; min-height:48px; margin-top:20px; border:none; border-radius:8px; background:#C0362C; color:#FFFFFF; font-family:inherit; font-size:16px; font-weight:500; cursor:pointer;\" style-hover=\"background:#9E2C24;\" sc-camel-on-click=\"{{ closeSheet }}\">Envoyer ma demande<\u002Fbutton>\n        <button style=\"width:100%; min-height:48px; margin-top:8px; border-radius:8px; background:transparent; border:1.5px solid #476A59; color:#385447; font-family:inherit; font-size:16px; font-weight:500; cursor:pointer;\" style-hover=\"background:#F2F6F3;\" sc-camel-on-click=\"{{ closeSheet }}\">Revenir en arrière<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:2050,&quot;height&quot;:1030},&quot;heuresCabinet&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Fermé&quot;,&quot;Ouvert&quot;],&quot;default&quot;:&quot;Fermé&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contenu&quot;},&quot;afficherRappels&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Contenu&quot;}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = {\n      view: \"accueil\", stack: [], tab: \"avenir\", filter: \"Tous\",\n      doc: null, sheet: null, upcoming: [\"a1\", \"a2\"],\n      qui: \"moi\", motif: \"\", besoins: [], motifErr: false,\n      adresse: \"Chemin des Vignes-Blanches 27bis, 1246 Cologny-sur-Léman\", adrOuvert: false, adrHors: false,\n      etage: \"3e étage, sans ascenseur\", code: \"\", creneau: \"apresmidi\",\n      notifSms: true, notifMail: false, dPage: \"accueil\"\n    };\n  }\n\n  titles() {\n    return {\n      accueil: \"\", rdv: \"Mes rendez-vous\", rdvDetail: \"Le rendez-vous\", cr: \"Compte rendu de visite\",\n      req1: \"Demander une visite\", req2: \"Demander une visite\", req3: \"Demander une visite\",\n      req4: \"Demander une visite\", conf: \"Demande envoyée\", renouv: \"Renouveler une ordonnance\",\n      docs: \"Mes documents\", docDetail: \"Le document\", hist: \"Tout mon historique\",\n      msg: \"Messages\", compte: \"Mon compte\"\n    };\n  }\n\n  go(v) { this.setState(s => ({ view: v, stack: s.stack.concat([s.view]), sheet: null })); }\n  tabTo(v) { this.setState({ view: v, stack: [], sheet: null }); }\n  back() {\n    this.setState(s => s.stack.length\n      ? { view: s.stack[s.stack.length - 1], stack: s.stack.slice(0, -1), sheet: null }\n      : { view: \"accueil\", stack: [], sheet: null });\n  }\n\n  navItem(active) {\n    return \"display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; cursor:pointer; color:\" +\n      (active ? \"#476A59; font-weight:500;\" : \"#5C5850;\");\n  }\n\n  dNavItem(active) {\n    return \"height:44px; display:flex; align-items:center; gap:12px; padding:0 24px; cursor:pointer; font-size:16px; border-left:3px solid \" +\n      (active ? \"#476A59; background:#F2F6F3; color:#385447; font-weight:500;\" : \"transparent; color:#5C5850;\");\n  }\n\n  tabStyle(active) {\n    return \"min-height:48px
